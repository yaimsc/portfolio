name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # deploy on every push to main
  workflow_dispatch: # allow manual re-runs from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write # required to mint the OIDC token for Pages

# Never run two deploys at once; cancel the in-flight one instead.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Resolves the public base path ("/" for a user site, "/<repo>/" for a
      # project site) so no path is ever hardcoded in vite.config.js.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build project
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4